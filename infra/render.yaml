services:
  - type: web
    name: projetista-v2-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: projetista-v2-db
          property: connectionString
      - key: CORS_ORIGINS
        sync: false

databases:
  - name: projetista-v2-db
    databaseName: projetista_v2
    user: projetista
