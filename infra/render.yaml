services:
  - type: web
    name: projetista-v2-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: projetista-v2-db
          property: connectionString
      - key: CORS_ORIGINS
        value: '["https://projetista-v2-frontend.vercel.app"]'
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        value: https://projetista-v2-frontend.vercel.app
      # Email — configurar manualmente no painel Render após deploy
      # MAIL_USERNAME, MAIL_PASSWORD, MAIL_FROM, MAIL_SERVER, MAIL_PORT

databases:
  - name: projetista-v2-db
    databaseName: projetista_v2
    user: projetista

