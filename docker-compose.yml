version: "3.9"

services:
  backend:
    image: python:3.12-slim
    container_name: projetista_v2_backend
    working_dir: /app
    volumes:
      - ./backend:/app
    command: >
      sh -c "pip install --no-cache-dir -r requirements.txt &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    depends_on:
      - db

  db:
    image: postgres:17
    container_name: projetista_v2_db
    environment:
      POSTGRES_DB: projetista_v2
      POSTGRES_USER: projetista
      POSTGRES_PASSWORD: projetista
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
